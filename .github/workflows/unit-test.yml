name: Run Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run Detekt to check for doc coverage
      id: detekt
      continue-on-error: true
      run: ./gradlew detektMetadataCommonMain -Pdisable.web.targets=true
    - name: Install Android NDK and CMake
      run: |
        SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        for attempt in 1 2 3; do
          if (yes || true) | "$SDKMANAGER" "cmake;3.22.1" "ndk;27.0.12077973"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Failed to install Android NDK and CMake after 3 attempts" >&2
            exit 1
          fi
          echo "Retrying Android SDK component install (attempt $((attempt + 1))/3)..."
          rm -rf "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/.temp"
          sleep 10
        done
    - name: Build with Gradle
      run: ./gradlew assemble lint -Pdisable.web.targets=true
    - name: Run unit tests
      run: ./gradlew check -x lint -x detektMetadataCommonMain -Pdisable.web.targets=true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run unit tests on Android Emulator API 35
      uses: reactivecircus/android-emulator-runner@v2
      env:
        NETSIM_HCI_PORT: 6402
      with:
        api-level: 35
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -netsim-args --hci-port=6402
        script: |
          EXIT_CODE=0
          ./gradlew connectedCheck -Pdisable.web.targets=true || EXIT_CODE=$?
          mkdir -p build/reports/logcat
          adb logcat -d > build/reports/logcat/logcat.txt || touch build/reports/logcat/logcat.txt
          exit $EXIT_CODE
    - name: Upload Logcat Output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-logcat
        path: build/reports/logcat/logcat.txt
    - name: Fail if Detekt failed
      if: steps.detekt.outcome == 'failure'
      run: |
        echo "Detekt found violations. Please ensure doc coverage."
        exit 1
