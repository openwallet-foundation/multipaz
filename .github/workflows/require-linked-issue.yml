name: Require Linked Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR links an issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Collect both the PR body and all commit messages in the PR so that
          # issue references, security advisories, or bypass markers work in either place.
          COMMIT_MESSAGES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --jq '.[].commit.message' || true)
          COMBINED_TEXT=$(printf "%s\n%s" "$PR_BODY" "$COMMIT_MESSAGES" | tr -d '\r')

          # 1. Standard GitHub auto-closing issue keywords:
          #    Matches: Fixes #12 | Closes owner/repo#12 | Resolves https://github.com/owner/repo/issues/12
          #    Requires real digits after '#', so the template placeholder
          #    '#<issue_number_goes_here>' does NOT count as a match.
          issue_pattern='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+(#[0-9]+|[A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[0-9]+|https://github\.com/[^ ]+/issues/[0-9]+)'

          # 2. Security advisory / CVE references:
          #    Matches: Addresses GHSA-xxxx-xxxx-xxxx | Fixes https://github.com/owner/repo/security/advisories/GHSA-xxxx-xxxx-xxxx | Fixes CVE-2026-12345
          advisory_pattern='(close[sd]?|fix(e[sd])?|resolve[sd]?|address(e[sd])?)[[:space:]]+(GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}|https://github\.com/([^ ]+/security/)?advisories/GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}|CVE-[0-9]{4}-[0-9]{4,})'

          # 3. Explicit bypass trailers or flags in commit message or PR description:
          #    Matches: No-Issue: <reason> | Issue: None | Fixes: N/A | LINKED_ISSUE_NOT_REQUIRED
          bypass_pattern='(^[[:space:]]*(No-Issue(:[[:space:]].*)?|Issue:[[:space:]]*(None|N/A)|Fixes:[[:space:]]*(None|N/A))[[:space:]]*$|LINKED_ISSUED?_NOT_REQUIRED)'

          if echo "$COMBINED_TEXT" | grep -iEq "$issue_pattern"; then
            echo "✅ Linked issue found."
          elif echo "$COMBINED_TEXT" | grep -iEq "$advisory_pattern"; then
            echo "✅ Linked security advisory found."
          elif echo "$COMBINED_TEXT" | grep -iEq "$bypass_pattern"; then
            echo "✅ Linked issue check bypassed via commit message or PR description."
          elif echo ",$PR_LABELS," | grep -iEq ',(no-issue|skip-issue),'; then
            echo "✅ Linked issue check bypassed via PR label."
          else
            echo "::error::This PR must link an issue (e.g. 'Fixes #123'), reference a security advisory (e.g. 'Addresses GHSA-xxxx-xxxx-xxxx'), or explicitly bypass the check (e.g. 'No-Issue: <reason>' or 'LINKED_ISSUE_NOT_REQUIRED')."
            exit 1
          fi
